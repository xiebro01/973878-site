<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>影视 — 973878.xyz</title>
<meta name="description" content="Letterboxd 观影记录：看过的、评分、短评。" />
<meta name="theme-color" content="#0B0D10" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="../../assets/style.css?v=20261117c" />
</head>
<body>
<main class="wrap page">

  <a class="back" href="../../">← 973878.xyz</a>
  <h1 class="page-title">影视</h1>
  <p class="page-sub">Letterboxd 与 NeoDB 两边的评分取平均，统一到 10 分制。哪边没记就只用另一边。</p>

  <div class="stats" id="stats" hidden></div>
  <div class="log" id="log"></div>

  <div class="empty" id="state" hidden>
    <strong id="state-title">正在读取观影记录</strong>
    <p id="state-text">第一次加载会稍慢一点。</p>
  </div>

  <p class="note" id="note"></p>

  <footer class="foot">
    <a href="../../">首页</a>
    <a href="https://letterboxd.com" target="_blank" rel="noopener noreferrer">Letterboxd</a>
    <span class="spacer"></span>
    <span class="mono" id="source"></span>
  </footer>

</main>

<script src="../../data/demo.js"></script>
<script>
(function () {
  const IS_LOCAL = location.protocol === 'file:';
  const log = document.getElementById('log');
  const stats = document.getElementById('stats');
  const state = document.getElementById('state');
  const stateTitle = document.getElementById('state-title');
  const stateText = document.getElementById('state-text');
  const note = document.getElementById('note');
  const source = document.getElementById('source');

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function fail(title, text) {
    log.innerHTML = '';
    stats.hidden = true;
    state.hidden = false;
    stateTitle.textContent = title;
    stateText.textContent = text;
  }

  function render(data) {
    if (!data || !data.items || !data.items.length) {
      fail('还没有观影记录', '去 Letterboxd 或 NeoDB 标记一部电影，这里就会多一行。');
      return;
    }

    state.hidden = true;
    stats.hidden = false;

    const avg = data.average != null ? data.average.toFixed(1) : '—';
    stats.innerHTML =
      '<div class="stat"><b>' + data.total + '</b><span>部</span></div>' +
      '<div class="stat"><b>' + avg + '</b><span>均分 / 10</span></div>' +
      '<div class="stat"><b>' + (data.matched || 0) + '</b><span>双源匹配</span></div>' +
      '<div class="stat"><b>' + (data.updated || '—') + '</b><span>同步于</span></div>';

    log.innerHTML = data.items.map(function (m) {
      const href = m.url || 'https://letterboxd.com';
      const score = m.score != null ? m.score.toFixed(1) : '—';
      const zh = m.titleZh || null;
      const en = m.titleEn || (zh ? m.title : null);
      const initial = (zh || m.title || '·').trim().charAt(0);

      const parts = [];
      if (m.lb != null) parts.push('LB ' + m.lb.toFixed(1));
      if (m.nd != null) parts.push('ND ' + m.nd.toFixed(1));
      if (m.review) parts.push(m.review);

      // 封面走自己的域名代理，避免访客的网络取不到源站图片
      const proxied = m.cover ? '/api/img?u=' + encodeURIComponent(m.cover) : null;

      return (
        '<div class="log-row" data-name="' + esc(m.title) + '" data-has-zh="' + (zh ? '1' : '0') + '">' +
          '<div class="poster">' +
            (proxied
              ? '<img src="' + proxied + '" data-fb="' + esc(m.cover) + '" alt="" loading="lazy" decoding="async" ' +
                'onerror="if(this.dataset.fb){this.src=this.dataset.fb;this.dataset.fb=\'\';}else{this.parentNode.textContent=\'' + esc(initial) + '\';}">'
              : esc(initial)) +
          '</div>' +
          '<div class="t"><a href="' + href + '" target="_blank" rel="noopener noreferrer">' + esc(zh || m.title) + '</a>' +
            (m.year ? '<span class="y">' + m.year + '</span>' : '') +
            (en ? '<span class="en">' + esc(en) + '</span>' : '') +
          '</div>' +
          '<div class="r">' + score + '</div>' +
          (parts.length ? '<div class="d">' + esc(parts.join(' · ')) + '</div>' : '') +
        '</div>'
      );
    }).join('');

    const s = data.sources || {};
    const tag = [];
    if (s.letterboxd && s.letterboxd.ok) tag.push('letterboxd');
    if (s.neodb && s.neodb.ok) tag.push('neodb');
    source.textContent = tag.length ? tag.join(' + ') : 'letterboxd';

    translate();
  }

  /* 没有中文名的条目，逐条向 /api/zh 补 */
  function translate() {
    if (IS_LOCAL) return;
    Array.from(document.querySelectorAll('.log-row[data-has-zh="0"]')).slice(0, 40).forEach(function (row) {
      const name = row.getAttribute('data-name');
      if (!name) return;
      const key = 'zh:movie:' + name;
      const cached = sessionStorage.getItem(key);

      function apply(zh) {
        if (!zh) return;
        const a = row.querySelector('.t a');
        const old = a.textContent;
        a.textContent = zh;
        if (!row.querySelector('.en')) {
          const en = document.createElement('span');
          en.className = 'en';
          en.textContent = old;
          row.querySelector('.t').appendChild(en);
        }
      }

      if (cached) {
        if (cached !== '-') apply(cached);
        return;
      }
      fetch('/api/zh?type=movie&q=' + encodeURIComponent(name))
        .then(function (r) { return r.json(); })
        .then(function (j) {
          sessionStorage.setItem(key, j.zh || '-');
          if (j.zh) apply(j.zh);
        })
        .catch(function () {});
    });
  }

  async function boot() {
    if (IS_LOCAL) {
      note.innerHTML = '本地预览模式，显示的是示例数据。部署后这里会变成你真实的观影记录。';
      render(window.DEMO && window.DEMO.movies);
      return;
    }

    try {
      const r = await fetch('/api/movies', { headers: { accept: 'application/json' } });
      const j = await r.json();
      if (!r.ok) throw new Error(j.message || ('HTTP ' + r.status));
      render(j);
    } catch (err) {
      fail('读不到观影记录', String(err.message || err));
      note.innerHTML = '检查 Cloudflare Pages 的环境变量 <code>LETTERBOXD_USER</code> 是否填了你的用户名。';
    }
  }

  boot();
})();
</script>
</body>
</html>
