<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>游戏 — 973878.xyz</title>
<meta name="description" content="Steam 游戏库：玩过的、时长、封面。" />
<meta name="theme-color" content="#0B0D10" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="../../assets/style.css?v=20261117a" />
</head>
<body>
<main class="wrap page">

  <a class="back" href="../../">← 973878.xyz</a>
  <h1 class="page-title">游戏</h1>
  <p class="page-sub">Steam 库自动同步。玩多久就是多久，不用手记。</p>

  <div class="stats" id="stats" hidden></div>

  <div class="toolbar" id="toolbar" hidden>
    <button class="chip is-on" data-mode="played" type="button">玩过的</button>
    <button class="chip" data-mode="all" type="button">全部</button>
    <span class="chip-note mono" id="shown"></span>
  </div>

  <div class="shelf" id="shelf"></div>

  <div class="more" id="more" hidden>
    <button class="btn" id="more-btn" type="button">加载更多</button>
  </div>

  <div class="empty" id="state" hidden>
    <strong id="state-title">正在读取 Steam 库</strong>
    <p id="state-text">第一次加载会稍慢一点。</p>
  </div>

  <p class="note" id="note"></p>

  <footer class="foot">
    <a href="../../">首页</a>
    <a href="https://steamcommunity.com" target="_blank" rel="noopener noreferrer">Steam</a>
    <span class="spacer"></span>
    <span class="mono" id="source"></span>
  </footer>

</main>

<script src="../../data/demo.js"></script>
<script>
(function () {
  const IS_LOCAL = location.protocol === 'file:';
  const PAGE = 60;

  const shelf = document.getElementById('shelf');
  const stats = document.getElementById('stats');
  const toolbar = document.getElementById('toolbar');
  const shownEl = document.getElementById('shown');
  const moreBox = document.getElementById('more');
  const moreBtn = document.getElementById('more-btn');
  const state = document.getElementById('state');
  const stateTitle = document.getElementById('state-title');
  const stateText = document.getElementById('state-text');
  const note = document.getElementById('note');
  const source = document.getElementById('source');

  let DATA = null;
  let mode = 'played';
  let limit = PAGE;

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function fmtHours(n) {
    if (!n) return '未玩';
    if (n < 1) return Math.round(n * 60) + ' 分钟';
    return (Math.round(n * 10) / 10) + ' 小时';
  }

  function fail(title, text) {
    shelf.innerHTML = '';
    stats.hidden = true;
    toolbar.hidden = true;
    moreBox.hidden = true;
    state.hidden = false;
    stateTitle.textContent = title;
    stateText.textContent = text;
  }

  function currentList() {
    if (!DATA) return [];
    return mode === 'played' ? DATA.items.filter(function (g) { return g.hours > 0; }) : DATA.items;
  }

  function tileHtml(g) {
    const initial = (g.zh || g.name || '·').trim().charAt(0);
    const fb = g.coverAlt ? ' data-fb="' + esc(g.coverAlt) + '"' : '';
    return (
      '<a class="tile" href="' + g.url + '" target="_blank" rel="noopener noreferrer" title="' + esc(g.name) + '" data-name="' + esc(g.name) + '">' +
        '<div class="cover">' +
          '<div class="ph">' + esc(initial) + '</div>' +
          '<img src="' + esc(g.cover) + '"' + fb + ' alt="" loading="lazy" decoding="async" ' +
            'onerror="if(this.dataset.fb){this.src=this.dataset.fb;this.dataset.fb=\'\';}else{this.remove();}">' +
        '</div>' +
        '<h3>' + esc(g.zh || g.name) + '</h3>' +
        '<div class="en"' + (g.zh ? '' : ' hidden') + '>' + esc(g.zh ? g.name : '') + '</div>' +
        '<div class="sub">' + fmtHours(g.hours) + '</div>' +
      '</a>'
    );
  }

  function paint(reset) {
    const list = currentList();
    const slice = list.slice(0, limit);

    if (reset) shelf.innerHTML = '';
    const start = reset ? 0 : shelf.children.length;
    const html = slice.slice(start).map(tileHtml).join('');
    shelf.insertAdjacentHTML('beforeend', html);

    shownEl.textContent = '显示 ' + Math.min(limit, list.length) + ' / ' + list.length;
    moreBox.hidden = limit >= list.length;

    translate();
  }

  function render(data) {
    DATA = data;
    if (!data || !data.items || !data.items.length) {
      fail('库里还没有游戏', '去 Steam 玩一会儿，或者检查「游戏详情」是否设为公开。');
      return;
    }

    state.hidden = true;
    stats.hidden = false;
    toolbar.hidden = false;

    const played = data.items.filter(function (g) { return g.hours > 0; }).length;

    stats.innerHTML =
      '<div class="stat"><b>' + data.total + '</b><span>游戏</span></div>' +
      '<div class="stat"><b>' + (data.hours || 0) + '</b><span>累计小时</span></div>' +
      '<div class="stat"><b>' + played + '</b><span>玩过</span></div>' +
      '<div class="stat"><b>' + (data.updated || '—') + '</b><span>同步于</span></div>';

    source.textContent = 'steam · ' + (data.mode === 'webapi' ? 'web api' : data.mode || 'sync');
    limit = PAGE;
    paint(true);
  }

  /* 中文名：只给进入视口的卡片补，结果记在 sessionStorage */
  function translate() {
    if (IS_LOCAL) return;
    const tiles = Array.from(shelf.querySelectorAll('.tile[data-name]'));

    function setZh(tile, zh) {
      if (!zh) return;
      const en = tile.getAttribute('data-name');
      if (zh === en) return;
      tile.querySelector('h3').textContent = zh;
      const enEl = tile.querySelector('.en');
      enEl.textContent = en;
      enEl.hidden = false;
    }

    function ask(tile) {
      const name = tile.getAttribute('data-name');
      if (!name || tile.dataset.done) return;
      tile.dataset.done = '1';

      const key = 'zh:game:' + name;
      const cached = sessionStorage.getItem(key);
      if (cached) {
        if (cached !== '-') setZh(tile, cached);
        return;
      }

      fetch('/api/zh?type=game&q=' + encodeURIComponent(name))
        .then(function (r) { return r.json(); })
        .then(function (j) {
          sessionStorage.setItem(key, j.zh || '-');
          if (j.zh) setZh(tile, j.zh);
        })
        .catch(function () {});
    }

    if (!('IntersectionObserver' in window)) {
      tiles.slice(0, 24).forEach(ask);
      return;
    }

    const io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (!e.isIntersecting) return;
        io.unobserve(e.target);
        ask(e.target);
      });
    }, { rootMargin: '200px' });

    tiles.forEach(function (t) { io.observe(t); });
  }

  toolbar.addEventListener('click', function (e) {
    const btn = e.target.closest('.chip');
    if (!btn) return;
    mode = btn.dataset.mode;
    Array.from(toolbar.querySelectorAll('.chip')).forEach(function (b) {
      b.classList.toggle('is-on', b === btn);
    });
    limit = PAGE;
    paint(true);
  });

  moreBtn.addEventListener('click', function () {
    limit += PAGE;
    paint(false);
  });

  async function boot() {
    if (IS_LOCAL) {
      note.innerHTML = '本地预览模式，显示的是示例数据。';
      render(window.DEMO && window.DEMO.games);
      return;
    }

    try {
      const r = await fetch('/api/games', { headers: { accept: 'application/json' } });
      const j = await r.json();
      if (!r.ok || j.error) throw new Error(j.message || ('HTTP ' + r.status));
      render(j);
    } catch (err) {
      try {
        const r2 = await fetch('/data/games.json?t=' + Date.now(), { cache: 'no-store' });
        if (r2.ok) {
          const j2 = await r2.json();
          render(j2);
          note.innerHTML = '数据来自本机同步，更新于 <b>' + (j2.updated || '—') + '</b>。';
          source.textContent = 'steam · 本机同步';
          return;
        }
      } catch (_) {}

      fail('读不到 Steam 库', String(err.message || err));
      note.innerHTML = '检查环境变量 <code>STEAM_KEY</code> 与 <code>STEAM_ID</code>，以及 Steam 资料的「游戏详情」是否公开。';
    }
  }

  boot();
})();
</script>
</body>
</html>
