<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>导航 — 973878.xyz</title>
<meta name="description" content="常去的地方都在这里。" />
<meta name="theme-color" content="#0B0D10" />
<link rel="icon" href="../favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="../assets/style.css?v=20261117c" />
</head>
<body>
<main class="wrap page">

  <a class="back" href="../">← 973878.xyz</a>
  <h1 class="page-title">导航</h1>
  <p class="page-sub">输入名称或关键词实时过滤。按 <span class="mono">/</span> 聚焦，<span class="mono">↑↓</span> 选择，<span class="mono">Enter</span> 打开。</p>

  <div class="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.4"/><path d="m16 16 4 4"/></svg>
    <label class="sr-only" for="q">搜索站点</label>
    <input id="q" type="search" placeholder="搜索站点，或直接输入网址…" autocomplete="off" spellcheck="false" />
    <span class="hint">/</span>
  </div>

  <div id="groups"></div>

  <div class="empty" id="empty" hidden>
    <strong>没有匹配的站点</strong>
    <p>换个关键词试试，或者到 <span class="mono">data/nav.js</span> 里加一条。</p>
  </div>

  <footer class="foot">
    <a href="../">首页</a>
    <a href="mailto:xie@973878.xyz" class="mono">xie@973878.xyz</a>
    <span class="spacer"></span>
    <span class="mono" id="count"></span>
    <span class="mono" id="updated"></span>
  </footer>

</main>

<script src="../data/nav.js"></script>
<script>
(function () {
  const NAV = window.NAV;
  const host = document.getElementById('groups');
  const empty = document.getElementById('empty');
  const input = document.getElementById('q');
  const countEl = document.getElementById('count');
  const updatedEl = document.getElementById('updated');
  const RECENT_KEY = 'nav.recent';
  const MAX_RECENT = 6;

  if (!NAV || !Array.isArray(NAV.groups)) {
    host.innerHTML = '<div class="empty"><strong>数据未加载</strong><p>检查 data/nav.js 是否存在。</p></div>';
    return;
  }

  const total = NAV.groups.reduce((n, g) => n + g.items.length, 0);
  countEl.textContent = total + ' 个站点';
  if (NAV.updated) updatedEl.textContent = '· ' + NAV.updated;

  /* ---------- 最近用过 ---------- */
  function readRecent() {
    try { return JSON.parse(localStorage.getItem(RECENT_KEY)) || []; } catch (_) { return []; }
  }
  function pushRecent(url) {
    const list = readRecent().filter((u) => u !== url);
    list.unshift(url);
    try { localStorage.setItem(RECENT_KEY, JSON.stringify(list.slice(0, MAX_RECENT))); } catch (_) {}
  }
  function recentItems() {
    const urls = readRecent();
    if (!urls.length) return [];
    const map = {};
    NAV.groups.forEach((g) => g.items.forEach((it) => { map[it.url] = it; }));
    return urls.map((u) => map[u]).filter(Boolean);
  }

  /* ---------- 渲染 ---------- */
  function iconFor(url) {
    let hostName = '';
    try { hostName = new URL(url).hostname.replace(/^www\./, ''); } catch (_) { return ''; }
    const letter = hostName.charAt(0).toUpperCase();
    const src = '/api/img?u=' + encodeURIComponent('https://icons.duckduckgo.com/ip3/' + hostName + '.ico');
    return '<span class="fav"><img src="' + src + '" alt="" loading="lazy" data-letter="' + letter +
      '" onerror="this.parentNode.textContent=this.dataset.letter;"></span>';
  }

  function itemHtml(it) {
    return (
      '<a class="item" href="' + it.url + '" target="_blank" rel="noopener noreferrer" data-url="' + it.url + '">' +
        iconFor(it.url) +
        '<span class="txt"><strong>' + esc(it.name) + '</strong><small>' + esc(it.desc || '') + '</small></span>' +
        (it.proxy ? '<span class="proxy" title="国内通常需要代理" aria-label="需要代理"></span>' : '') +
      '</a>'
    );
  }

  function sectionHtml(title, items) {
    if (!items.length) return '';
    return (
      '<section class="group">' +
        '<h2 class="group-title">' + esc(title) + ' · ' + items.length + '</h2>' +
        '<div class="items">' + items.map(itemHtml).join('') + '</div>' +
      '</section>'
    );
  }

  function render(keyword) {
    const kw = keyword.trim().toLowerCase();
    let html = '';
    let shown = 0;

    if (!kw) {
      const recent = recentItems();
      if (recent.length) {
        html += sectionHtml('最近', recent);
        shown += recent.length;
      }
    }

    NAV.groups.forEach(function (group) {
      const hits = kw
        ? group.items.filter(function (it) {
            return (it.name + ' ' + (it.desc || '') + ' ' + it.url).toLowerCase().includes(kw);
          })
        : group.items;
      if (!hits.length) return;
      shown += hits.length;
      html += sectionHtml(group.title, hits);
    });

    if (kw && /^[a-z0-9.-]+\.[a-z]{2,}(\/\S*)?$/i.test(kw)) {
      const direct = 'https://' + kw;
      html = '<section class="group"><h2 class="group-title">直接打开</h2><div class="items">' +
        '<a class="item" href="' + direct + '" target="_blank" rel="noopener noreferrer" data-url="' + direct + '">' +
        iconFor(direct) + '<span class="txt"><strong>' + esc(kw) + '</strong><small>在新标签打开</small></span></a>' +
        '</div></section>' + html;
      shown += 1;
    }

    host.innerHTML = html;
    empty.hidden = shown !== 0;
    countEl.textContent = kw ? shown + ' / ' + total + ' 个站点' : total + ' 个站点';
    focusIndex = -1;
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /* ---------- 点击记录 ---------- */
  host.addEventListener('click', function (e) {
    const a = e.target.closest('.item');
    if (a && a.dataset.url) pushRecent(a.dataset.url);
  });

  /* ---------- 键盘 ---------- */
  let focusIndex = -1;

  function items() {
    return Array.from(host.querySelectorAll('.item'));
  }

  function setFocus(i) {
    const list = items();
    if (!list.length) return;
    if (i < 0) i = list.length - 1;
    if (i >= list.length) i = 0;
    list.forEach(function (el) { el.classList.remove('is-focus'); });
    list[i].classList.add('is-focus');
    list[i].scrollIntoView({ block: 'nearest' });
    focusIndex = i;
  }

  input.addEventListener('input', function () { render(input.value); });

  document.addEventListener('keydown', function (e) {
    const inSearch = document.activeElement === input;

    if (e.key === '/' && !inSearch) {
      e.preventDefault();
      input.focus();
      return;
    }

    if (e.key === 'Escape' && inSearch) {
      input.value = '';
      render('');
      input.blur();
      return;
    }

    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      setFocus(focusIndex + (e.key === 'ArrowDown' ? 1 : -1));
      return;
    }

    if (e.key === 'Enter') {
      const list = items();
      const target = list[focusIndex >= 0 ? focusIndex : 0];
      if (target) {
        e.preventDefault();
        pushRecent(target.dataset.url);
        window.open(target.dataset.url, '_blank', 'noopener');
      }
    }
  });

  render('');
})();
</script>
</body>
</html>
